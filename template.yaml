AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: DropAPI - S3 upload -> EventBridge -> Step Functions -> DynamoDB -> HTTP API

Resources:
  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - POST
            AllowedOrigins:
              - "*"
      LifecycleConfiguration:
        Rules:
          - Id: ExpireUploadsAfterSevenDays
            Prefix: uploads/
            Status: Enabled
            ExpirationInDays: 7

  DatasetsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: dataset_id
          AttributeType: S
      KeySchema:
        - AttributeName: dataset_id
          KeyType: HASH

  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: dataset_id
          AttributeType: S
        - AttributeName: row_key
          AttributeType: S
      KeySchema:
        - AttributeName: dataset_id
          KeyType: HASH
        - AttributeName: row_key
          KeyType: RANGE

  LoadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/load/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Timeout: 120
      MemorySize: 1024
      Environment:
        Variables:
          ITEMS_TABLE: !Ref ItemsTable
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref UploadBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref ItemsTable

  IngestStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      DefinitionUri: statemachine/ingest.asl.json
      DefinitionSubstitutions:
        DatasetsTable: !Ref DatasetsTable
        LoadFunctionArn: !GetAtt LoadFunction.Arn
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref DatasetsTable
        - LambdaInvokePolicy:
            FunctionName: !Ref LoadFunction
      Events:
        NewUpload:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source:
                - aws.s3
              detail-type:
                - Object Created
              detail:
                bucket:
                  name:
                    - !Ref UploadBucket
                object:
                  key:
                    - prefix: "uploads/"

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowHeaders:
          - content-type
          - x-api-key
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowOrigins:
          - "*"
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Timeout: 20
      MemorySize: 512
      Environment:
        Variables:
          DATASETS_TABLE: !Ref DatasetsTable
          ITEMS_TABLE: !Ref ItemsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DatasetsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ItemsTable
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: GET
        Everything:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  UploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/upload/
      Handler: upload.lambda_handler
      Runtime: python3.12
      Timeout: 5
      MemorySize: 128
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadBucket
          DATASETS_TABLE: !Ref DatasetsTable
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "${UploadBucket.Arn}/uploads/*"
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt DatasetsTable.Arn
      Events:
        UploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /upload-url
            Method: POST

Outputs:
  UploadBucketName:
    Value: !Ref UploadBucket
  StateMachineArn:
    Value: !Ref IngestStateMachine
  DatasetsTableName:
    Value: !Ref DatasetsTable
  ItemsTableName:
    Value: !Ref ItemsTable
  ApiUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"